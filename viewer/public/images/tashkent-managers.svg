<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .header-bg { fill: #1e293b; }
      .row-even { fill: #1e293b; fill-opacity: 0.4; }
      .row-odd { fill: #0f172a; fill-opacity: 0.8; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .th { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; font-size: 14px; font-weight: 700; fill: #94a3b8; }
      .td-org { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; font-size: 14px; font-weight: 600; fill: #ffffff; }
      .td-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; font-size: 14px; font-weight: 500; fill: #38bdf8; }
      .td-phone { font-family: "Courier New", Courier, monospace, sans-serif; font-size: 14px; font-weight: 700; fill: #34d399; }
      .grid-line { stroke: #334155; stroke-width: 1; }
      .border { stroke: #38bdf8; stroke-width: 2; fill: none; }

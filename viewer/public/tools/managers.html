<html lang="uz">
<head>

    <link rel="icon" type="image/png" href="/images/title-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0b1120;
            --bg-card: rgba(15, 23, 42, 0.85);
            --border-color: rgba(59, 130, 246, 0.25);
            --border-highlight: rgba(56, 189, 248, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
            --accent-purple: #a855f7;
            --accent-amber: #f59e0b;
            --font-scale: 1;
            /* Design Engineering Motion Tokens */
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.15);
            --duration-fast: 140ms;
            --duration-normal: 220ms;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            font-size: calc(14px * var(--font-scale));
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Top Header */
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 22px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .header-title-block {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
        }

        .header-title-block h1 {
            font-size: calc(18px * var(--font-scale));
            font-weight: 800;
            letter-spacing: -0.3px;
            color: #ffffff;
        }

        .header-title-block p {
            font-size: calc(12px * var(--font-scale));
            color: var(--text-muted);
            margin-top: 2px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Font Zoom Controls */
        .zoom-controls {
            display: inline-flex;
            align-items: center;
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2px;
            gap: 2px;
        }

        .zoom-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .zoom-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .zoom-badge {
            font-family: 'Inter', monospace;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--accent-blue);
            padding: 0 6px;
            min-width: 42px;
            text-align: center;
        }

        /* Tabs Navigation */
        .tabs-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 6px;
            border-radius: 12px;
            margin-bottom: 16px;
            overflow-x: auto;
        }

        .tab-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-size: calc(13.5px * var(--font-scale));
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3), rgba(37, 99, 235, 0.18));
            color: #60a5fa;
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
        }

        .tab-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: inherit;
        }

        .tab-btn.active .tab-badge {
            background: rgba(59, 130, 246, 0.4);
            color: #ffffff;
        }

        /* Search Bar */
        .search-box {
            position: relative;
            margin-bottom: 16px;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 12px 18px 12px 46px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #ffffff;
            font-size: calc(14px * var(--font-scale));
            outline: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .search-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15), 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .search-clear {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-muted);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }

        /* Table Card Container */
        .table-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
        }

        .table-header-info {
            padding: 16px 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.5);
            flex-wrap: wrap;
            gap: 10px;
        }

        .table-subtitle {
            font-size: calc(14px * var(--font-scale));
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-count {
            font-size: 12px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.06);
            padding: 3px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .table-responsive {
            overflow-x: auto;
            width: 100%;
        }

        /* Modern Vector Table */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: calc(13.5px * var(--font-scale));
        }

        thead {
            background: rgba(15, 23, 42, 0.95);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 14px 18px;
            font-weight: 700;
            color: #cbd5e1;
            font-size: calc(12px * var(--font-scale));
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-bottom: 2px solid rgba(59, 130, 246, 0.35);
            white-space: nowrap;
        }

        td {
            padding: 14px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            vertical-align: middle;
            transition: background 0.15s ease;
        }

        tbody tr:hover {
            background: rgba(59, 130, 246, 0.08);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* Typography & Badges inside table */
        .org-name {
            font-weight: 700;
            color: #ffffff;
            font-family: 'Golos Text', 'Inter', sans-serif;
            font-size: calc(14px * var(--font-scale));
        }

        .officer-name {
            font-weight: 600;
            color: #38bdf8;
            font-size: calc(13.5px * var(--font-scale));
        }

        .lead-officer {
            font-weight: 700;
            color: #fcd34d;
            background: rgba(245, 158, 11, 0.1);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(245, 158, 11, 0.25);
            display: inline-block;
        }

        /* Phone Item styling with Copy & Call */
        .phone-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .phone-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 8px;
            padding: 5px 10px;
            font-family: 'Inter', monospace;
            font-weight: 700;
            font-size: calc(13px * var(--font-scale));
            color: #38bdf8;
            transition: all 0.2s ease;
            width: fit-content;
        }

        .phone-pill:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
            transform: translateY(-1px);
        }

        .phone-pill.office {
            border-color: rgba(245, 158, 11, 0.4);
            color: #fbbf24;
            background: rgba(245, 158, 11, 0.08);
        }

        .phone-pill.office:hover {
            border-color: #fbbf24;
            background: rgba(245, 158, 11, 0.18);
        }

        .phone-action-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 12px;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .phone-action-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
        }

        .phone-call-link {
            color: inherit;
            text-decoration: none;
        }

        /* Ministry tags */
        .ministry-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .ministry-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.25);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: calc(12.5px * var(--font-scale));
            color: #ddd6fe;
        }

        .ministry-item svg {
            color: #a78bfa;
            flex-shrink: 0;
        }

        /* Row entrance & hover animation */
        @keyframes rowGlideIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        tbody tr {
            animation: rowGlideIn var(--duration-normal) var(--ease-out) both;
            will-change: transform, opacity;
        }

        /* Tactile Button Feedback */
        .tab-btn:active,
        .zoom-btn:active,
        .phone-pill:active,
        .phone-action-btn:active,
        .search-clear:active {
            transform: scale(0.96) !important;
        }

        /* Copy Toast notification */
        .copy-toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #10b981;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 9999;
            opacity: 0;
            transform: translateY(12px) scale(0.96);
            transition: opacity var(--duration-normal) var(--ease-out),
                        transform var(--duration-normal) var(--ease-out);
            pointer-events: none;
            will-change: transform, opacity;
        }

        .copy-toast.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            tbody tr, .copy-toast, .tab-btn, .zoom-btn {
                animation: none !important;
                transition: none !important;
            }
        }

        /* Empty state */
        .empty-state {
            padding: 50px 20px;
            text-align: center;
            color: var(--text-muted);
            animation: rowGlideIn var(--duration-normal) var(--ease-out) both;
        }

        .empty-icon {
            font-size: 36px;
            margin-bottom: 8px;
            display: block;
        }

        /* Print styles */
        @media print {
            body {
                background: #ffffff !important;
                color: #000000 !important;
                padding: 0;
            }
            .header-bar, .tabs-nav, .search-box, .zoom-controls, .copy-toast {
                display: none !important;
            }
            .table-card {
                border: 1px solid #ccc !important;
                box-shadow: none !important;
                background: #ffffff !important;
            }
            th, td {
                color: #000000 !important;
                border: 1px solid #ccc !important;
            }
            .phone-pill {
                border: none !important;
                color: #000000 !important;
                padding: 0 !important;
            }
        }
    </style>
</head>

/* ==========================================================================

   ========================================================================== */
let activeTab = 'tashkent';
let searchQuery = '';
let currentFontScale = 1.0;

function init() {
    // Parse URL params (?tab=tashkent | ministry | regions & q=...)
    const params = new URLSearchParams(window.location.search);
    const tabParam = params.get('tab');
    if (tabParam && ['tashkent', 'ministry', 'regions'].includes(tabParam)) {
        activeTab = tabParam;
    }
    const qParam = params.get('q');
    if (qParam) {
        searchQuery = qParam;
        document.getElementById('searchInput').value = searchQuery;
    }

    renderTabs();
    renderContent();
}

function switchTab(tab) {
    activeTab = tab;
    renderTabs();
    renderContent();
}

function renderTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.getAttribute('data-tab') === activeTab) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });

    const subTitleEl = document.getElementById('tableSubtitle');
    if (activeTab === 'tashkent') {
        subTitleEl.innerHTML = `<span>🏙️ Toshkent shahridagi tumanlar va shartnoma bo'limiga biriktirilgan mas'ullar</span>`;
    } else if (activeTab === 'ministry') {
        subTitleEl.innerHTML = `<span>🏛️ Vazirliklarga biriktirilgan mas'ul xodimlar</span>`;
    } else {
        subTitleEl.innerHTML = `<span>🗺️ Viloyatlar bo'yicha mas'ul rahbarlar va ofis raqamlari</span>`;
    }
}

function handleSearch(val) {
    searchQuery = (val || '').trim().toLowerCase();
    const clearBtn = document.getElementById('searchClearBtn');
    if (clearBtn) clearBtn.style.display = searchQuery ? 'flex' : 'none';
    renderContent();
}

function clearSearch() {
    searchQuery = '';
    const input = document.getElementById('searchInput');
    if (input) {
        input.value = '';
        input.focus();
    }
    const clearBtn = document.getElementById('searchClearBtn');
    if (clearBtn) clearBtn.style.display = 'none';
    renderContent();
}

function highlight(text, query) {
    if (!query || !text) return escapeHtml(text);
    const escaped = escapeHtml(text);
    const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    return escaped.replace(regex, `<mark style="background: rgba(245, 158, 11, 0.4); color: #fff; border-radius: 3px; padding: 0 2px;">$1</mark>`);
}

function escapeHtml(str) {
    if (typeof str !== 'string') return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function copyPhone(phone, event) {
    if (event) event.stopPropagation();
    const clean = phone.trim();
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(clean).then(() => showToast(clean));
    } else {
        const ta = document.createElement('textarea');
        ta.value = clean;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(clean);
    }
}

let toastTimer = null;
function showToast(text) {
    const toast = document.getElementById('copyToast');
    const toastText = document.getElementById('copyToastText');
    if (!toast) return;
    if (toastText) toastText.innerText = `${text} — nusxalandi!`;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        toast.classList.remove('show');
    }, 2200);
}

/* ==========================================================================
   FONT ZOOM CONTROLS (VECTOR SCALING)
   ========================================================================== */
function changeFontScale(delta) {
    currentFontScale = Math.max(0.8, Math.min(1.8, Math.round((currentFontScale + delta) * 10) / 10));
    applyFontScale();
}

function resetFontScale() {
    currentFontScale = 1.0;
    applyFontScale();
}

function applyFontScale() {
    document.documentElement.style.setProperty('--font-scale', currentFontScale);
    const badge = document.getElementById('zoomBadge');
    if (badge) badge.innerText = `${Math.round(currentFontScale * 100)}%`;
}

// Global hotkeys (Ctrl + wheel / Ctrl + / Ctrl -)
window.addEventListener('wheel', (e) => {
    if (e.ctrlKey) {
        e.preventDefault();
        changeFontScale(e.deltaY < 0 ? 0.1 : -0.1);
    }
}, { passive: false });

document.addEventListener('DOMContentLoaded', init);

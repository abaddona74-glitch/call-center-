<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Tizimlar va Rollar Daraxti | Call Center AI</title>
    <link rel="icon" type="image/png" href="/images/title-icon.png">
    
    <!-- Localized Fonts -->
    <link rel="stylesheet" href="/fonts/fonts.css?v=1.0">
    <link rel="stylesheet" href="/css/style.css?v=25.0">
    
    <style>
        :root {
            --bg-color: #ffffff;
            --grid-color: rgba(148, 163, 184, 0.35);
            --header-bg: #ffffff;
            --header-border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --btn-bg: #f1f5f9;
            --btn-border: #cbd5e1;
            --btn-color: #334155;
            --btn-hover: #e2e8f0;
            --conn-line: #94a3b8;
            
            /* Depth 0 (Root pills, e.g. EDO, E-huquqshunos, Mahalla) - Image 1 Exact Style */
            --card-d0-bg: #f0f7ff;
            --card-d0-border: #93c5fd;
            --card-d0-color: #0369a1;
            --card-d0-badge-bg: #dbeafe;
            --card-d0-badge-color: #0284c7;

            /* Depth 1 (Green tone) */
            --card-d1-bg: #f0fdf4;
            --card-d1-border: #86efac;
            --card-d1-color: #047857;
            --card-d1-badge-bg: #dcfce7;
            --card-d1-badge-color: #059669;

            /* Depth 2 (Purple tone) */
            --card-d2-bg: #faf5ff;
            --card-d2-border: #d8b4fe;
            --card-d2-color: #6d28d9;
            --card-d2-badge-bg: #f3e8ff;
            --card-d2-badge-color: #7c3aed;
        }

        body.dark-theme {
            --bg-color: #080d1a;
            --grid-color: rgba(56, 189, 248, 0.08);
            --header-bg: rgba(15, 23, 42, 0.94);
            --header-border: rgba(59, 130, 246, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --btn-bg: rgba(255, 255, 255, 0.06);
            --btn-border: rgba(255, 255, 255, 0.15);
            --btn-color: #cbd5e1;
            --btn-hover: rgba(56, 189, 248, 0.15);
            --conn-line: rgba(148, 163, 184, 0.45);

            --card-d0-bg: #0c1c38;
            --card-d0-border: rgba(56, 189, 248, 0.55);
            --card-d0-color: #38bdf8;
            --card-d0-badge-bg: rgba(56, 189, 248, 0.25);
            --card-d0-badge-color: #bae6fd;

            --card-d1-bg: #062820;
            --card-d1-border: rgba(16, 185, 129, 0.55);
            --card-d1-color: #34d399;
            --card-d1-badge-bg: rgba(16, 185, 129, 0.25);
            --card-d1-badge-color: #a7f3d0;

            --card-d2-bg: #201338;
            --card-d2-border: rgba(168, 85, 247, 0.55);
            --card-d2-color: #c084fc;
            --card-d2-badge-bg: rgba(168, 85, 247, 0.25);
            --card-d2-badge-color: #f3e8ff;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color) !important;
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* Top Sticky Header */
        .guide-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
            padding: 0 24px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--header-border);
            backdrop-filter: blur(16px);
            position: relative;
            z-index: 100;
            box-shadow: 0 2px 14px rgba(0, 0, 0, 0.06);
            transition: background 0.25s ease, border-color 0.25s ease;
        }

        .guide-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .guide-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 14px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 9px;
            color: var(--btn-color);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .guide-back-btn:hover {
            background: var(--btn-hover);
            color: var(--text-main);
            transform: translateX(-2px);
        }

        .guide-title-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .guide-icon-badge {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(56, 189, 248, 0.2));
            border: 1px solid rgba(56, 189, 248, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0284c7;
        }
        body.dark-theme .guide-icon-badge {
            color: #38bdf8;
        }

        .guide-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .guide-pill {
            font-size: 10.5px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 5px;
            background: rgba(16, 185, 129, 0.15);
            color: #059669;
            border: 1px solid rgba(16, 185, 129, 0.35);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        body.dark-theme .guide-pill {
            color: #34d399;
            background: rgba(16, 185, 129, 0.2);
            border-color: rgba(16, 185, 129, 0.4);
        }

        .guide-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-action-guide {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 14px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 9px;
            color: var(--btn-color);
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-action-guide:hover {
            background: var(--btn-hover);
            color: var(--text-main);
        }

        /* Infinite Canvas Viewport */
        .ft-viewport {
            width: 100vw;
            height: calc(100vh - 64px);
            position: relative;
            overflow: hidden;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(var(--grid-color) 1.2px, transparent 1.2px),
                linear-gradient(to right, rgba(148, 163, 184, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(148, 163, 184, 0.04) 1px, transparent 1px);
            background-size: 32px 32px, 128px 128px, 128px 128px;
            background-position: 0 0, 0 0, 0 0;
            cursor: grab;
            transition: background-color 0.25s ease;
        }
        .ft-viewport.is-dragging {
            cursor: grabbing !important;
        }

        /* Transform Layer */
        .ft-transform-layer {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            padding: 60px 100px 300px;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            min-width: 100%;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: geometricPrecision;
            transform-style: flat;
            backface-visibility: visible;
        }

        /* Focus Tree Org-Chart Styles */
        .ft-branch {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .ft-row {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 0;
            position: relative;
        }
        .ft-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 1;
            transform: scale(1);
            margin: 0 32px; /* NON-COLLIDING: Spacious margin between tree columns */
            padding: 0;
            transition: max-width 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                        margin 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .ft-col.is-collapsed {
            max-width: 0 !important;
            opacity: 0 !important;
            transform: scale(0.68) !important;
            margin: 0 !important;
            padding: 0 !important;
            pointer-events: none !important;
            overflow: hidden !important;
        }

        /* Cards - Pill Design matching Image 1 */
        .ft-card {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 22px;
            font-size: 14.5px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            outline: none;
            position: relative;
            z-index: 10;
            white-space: nowrap;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: geometricPrecision;
            transform-style: flat;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                        background 0.2s ease,
                        border-color 0.2s ease,
                        color 0.2s ease;
        }
        .ft-card:focus-visible {
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.5);
        }
        .ft-card.is-open {
            transform: scale(1.08) !important;
            box-shadow: 0 8px 24px rgba(2, 132, 199, 0.22) !important;
            z-index: 25 !important;
        }
        .ft-card.ft-leaf {
            cursor: default;
        }
        .ft-card.ft-link {
            cursor: pointer;
            text-decoration: none;
        }
        .ft-card.ft-link:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
        }

        /* Node Anchor */
        .ft-node-anchor {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Floating Tooltip Popover on Hover (ZERO layout impact, ZERO collision) */
        .ft-hint-popover {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            width: max-content;
            max-width: 260px;
            background: #0f172a;
            color: #f8fafc;
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 9px;
            padding: 8px 12px;
            font-size: 11.5px;
            line-height: 1.45;
            text-align: center;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
            z-index: 1000;
            white-space: normal;
        }
        .ft-hint-popover::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: #0f172a;
        }
        .ft-node-anchor:hover .ft-hint-popover {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* Subtle in-column hint subtitle (centered, zero overflow) */
        .ft-hint-sub {
            font-size: 11px;
            color: var(--text-muted);
            max-width: 200px;
            margin-top: 6px;
            text-align: center;
            line-height: 1.35;
            word-break: break-word;
            white-space: normal;
            transition: opacity 0.2s ease;
        }
        body.hide-hints .ft-hint-sub {
            display: none !important;
        }

        /* Depth Tints matching Image 1 */
        .ft-depth-0 {
            background: var(--card-d0-bg);
            border: 1.5px solid var(--card-d0-border);
            color: var(--card-d0-color);
        }
        .ft-depth-0:hover:not(.ft-leaf), .ft-depth-0.is-open {
            border-color: #0284c7;
            background: #e0f2fe;
            color: #0369a1;
        }
        body.dark-theme .ft-depth-0:hover:not(.ft-leaf), body.dark-theme .ft-depth-0.is-open {
            background: #0e2a54;
            border-color: #38bdf8;
            color: #ffffff;
        }
        .ft-depth-0 .ft-badge {
            background: var(--card-d0-badge-bg);
            color: var(--card-d0-badge-color);
        }

        .ft-depth-1 {
            background: var(--card-d1-bg);
            border: 1.5px solid var(--card-d1-border);
            color: var(--card-d1-color);
        }
        .ft-depth-1:hover:not(.ft-leaf), .ft-depth-1.is-open {
            border-color: #059669;
            background: #dcfce7;
            color: #047857;
        }
        body.dark-theme .ft-depth-1:hover:not(.ft-leaf), body.dark-theme .ft-depth-1.is-open {
            background: #093c30;
            border-color: #34d399;
            color: #ffffff;
        }
        .ft-depth-1 .ft-badge {
            background: var(--card-d1-badge-bg);
            color: var(--card-d1-badge-color);
        }

        .ft-depth-2 {
            background: var(--card-d2-bg);
            border: 1.5px solid var(--card-d2-border);
            color: var(--card-d2-color);
        }
        .ft-depth-2:hover:not(.ft-leaf), .ft-depth-2.is-open {
            border-color: #7c3aed;
            background: #f3e8ff;
            color: #6d28d9;
        }
        body.dark-theme .ft-depth-2:hover:not(.ft-leaf), body.dark-theme .ft-depth-2.is-open {
            background: #311d54;
            border-color: #c084fc;
            color: #ffffff;
        }
        .ft-depth-2 .ft-badge {
            background: var(--card-d2-badge-bg);
            color: var(--card-d2-badge-color);
        }

        .ft-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 13px;
            font-weight: 700;
            line-height: 1;
        }

        .ft-subtree {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-height: 0;
            opacity: 0;
            transform: scale(0.85);
            transform-origin: top center;
            pointer-events: none;
            overflow: hidden;
            transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .ft-subtree.is-open {
            max-height: 1400px !important;
            opacity: 1 !important;
            transform: scale(1) !important;
            pointer-events: auto !important;
            overflow: visible !important;
        }

        /* 1px Connector Lines */
        .ft-stem {
            width: 1px;
            height: 24px;
            background: rgba(148, 163, 184, 0.45);
            margin: 0 auto;
            flex-shrink: 0;
        }
        .ft-connector {
            width: 100%;
            height: 24px;
            position: relative;
            flex-shrink: 0;
        }
        .ft-connector.ft-single {
            width: 1px;
            height: 24px;
            background: rgba(148, 163, 184, 0.45);
            margin: 0 auto;
        }
        .ft-connector.ft-first {
            position: relative;
        }
        .ft-connector.ft-first::after {
            content: '';
            position: absolute;
            left: 50%;
            right: 0;
            top: 0;
            bottom: 0;
            border-top: 1px solid rgba(148, 163, 184, 0.45);
            border-left: 1px solid rgba(148, 163, 184, 0.45);
            border-top-left-radius: 8px;
        }
        .ft-connector.ft-last {
            position: relative;
        }
        .ft-connector.ft-last::after {
            content: '';
            position: absolute;
            left: 0;
            right: 50%;
            top: 0;
            bottom: 0;
            border-top: 1px solid rgba(148, 163, 184, 0.45);
            border-right: 1px solid rgba(148, 163, 184, 0.45);
            border-top-right-radius: 8px;
        }
        .ft-connector.ft-mid {
            position: relative;
        }
        .ft-connector.ft-mid::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            border-top: 1px solid rgba(148, 163, 184, 0.45);
        }
        .ft-connector.ft-mid::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1px;
            background: rgba(148, 163, 184, 0.45);
        }

        /* Floating Canvas Controls Overlay */
        .ft-controls-panel {
            position: absolute;
            bottom: 24px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(59, 130, 246, 0.35);
            border-radius: 12px;
            backdrop-filter: blur(14px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 50;
        }

        .ft-ctrl-btn {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .ft-ctrl-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.4);
            color: #fff;
        }

        .ft-zoom-badge {
            font-size: 12px;
            font-weight: 700;
            color: #38bdf8;
            padding: 0 10px;
            min-width: 54px;
            text-align: center;
            cursor: pointer;
            font-family: monospace;
        }
        .ft-zoom-badge:hover {
            text-decoration: underline;
        }

        /* Floating Helper Hint */
        .ft-helper-pill {
            position: absolute;
            bottom: 24px;
            left: 24px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 12px;
            color: #94a3b8;
            backdrop-filter: blur(12px);
            z-index: 50;
            pointer-events: none;
        }
        .ft-helper-pill b {
            color: #e2e8f0;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="guide-header">
        <div class="guide-header-left">
            <a href="/" class="guide-back-btn" title="Bosh sahifa (Viewer)ga qaytish">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                <span>Bosh sahifaga qaytish</span>
            </a>
            <div class="guide-title-box">
                <div class="guide-icon-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 20px; height: 20px;"><path d="M12 6V2M12 22v-4M2 12h4M18 12h4"/><circle cx="12" cy="4" r="2"/><circle cx="12" cy="20" r="2"/><circle cx="4" cy="12" r="2"/><circle cx="20" cy="12" r="2"/></svg>
                </div>
                <div>
                    <h1 class="guide-title">
                        <span>Tizimlar va Rollar Daraxti</span>
                        <span class="guide-pill">Interaktiv</span>
                    </h1>
                </div>
            </div>
        </div>

        <div class="guide-header-actions">
            <button type="button" class="btn-action-guide" id="btnThemeToggle" onclick="toggleGuideTheme()" title="Yorug' va Qorong'u rejimni almashtirish">
                <span id="themeToggleText">🌙 Qorong'u rejim</span>
            </button>
            <button type="button" class="btn-action-guide" id="btnToggleHints" onclick="toggleTreeHints()" title="Izoh va hintlarni ko'rsatish yoki yashirish">
                <span id="hintToggleText">💡 Hintlar: ON</span>
            </button>
            <button type="button" class="btn-action-guide" onclick="centerTree()" title="Daraxtni ekranning markaziga qaytarish">
                <span>🎯 Markazga olish</span>
            </button>
            <button type="button" class="btn-action-guide" onclick="resetFocusTree()" title="Barcha ochilgan rollarni yopish">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                <span>Barchasini yopish</span>
            </button>
        </div>
    </header>

    <!-- Infinite Viewport -->
    <div class="ft-viewport" id="treeViewport">
        <!-- Transformable Layer -->
        <div class="ft-transform-layer" id="transformLayer">
            <div class="ft-branch" id="focusTreeCanvas">
                <div style="text-align: center; color: #94a3b8; padding: 40px; font-size: 15px;">Daraxt yuklanmoqda...</div>
            </div>
        </div>

        <!-- Sleek Info Bar at bottom-left (ZERO collision with tree) -->
        <div class="ft-info-bar" id="ftInfoBar">
            <div class="ft-info-icon">💡</div>
            <div class="ft-info-body">
                <div class="ft-info-title" id="ftInfoTitle">Tanlangan tizim</div>
                <div class="ft-info-desc" id="ftInfoDesc">Tizim bo'limi yoki rol haqida ma'lumot olish uchun kursor bilan ustiga keling yoki bosing.</div>
            </div>
        </div>

        <!-- Floating Controls Panel -->
        <div class="ft-controls-panel">
            <button type="button" class="ft-ctrl-btn" onclick="zoomIn()" title="Kattalashtirish (Zoom In)">+</button>
            <button type="button" class="ft-ctrl-btn" onclick="zoomOut()" title="Kichraytirish (Zoom Out)">−</button>
            <span class="ft-zoom-badge" id="zoomBadge" onclick="resetZoom()" title="100% ga qaytarish">100%</span>
            <button type="button" class="ft-ctrl-btn" onclick="centerTree()" title="Markazga keltirish (Fit to View)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
            </button>
        </div>

        <!-- Helper Hint -->
        <div class="ft-helper-pill">
            <span>🖱️ <b>Sichqoncha:</b> Zoom & Siljitish</span>
            <span>👆 <b>Tugmalar:</b> Rollarni ochish</span>
        </div>
    </div>

    <!-- Script logic for Focus Tree + Mouse Wheel Zoom & Pan Engine -->
    <script>
        // State
        let focusTreeData = null;
        const focusTreeState = {};

        // Canvas Zoom & Pan State
        let scale = 1.0;
        let panX = 0;
        let panY = 40;
        let isDragging = false;
        let startDragX = 0;
        let startDragY = 0;
        let hasMoved = false;

        const viewport = document.getElementById('treeViewport');
        const transformLayer = document.getElementById('transformLayer');
        const zoomBadge = document.getElementById('zoomBadge');

        function updateTransform(animated = false) {
            if (animated) {
                transformLayer.style.transition = 'transform 0.25s cubic-bezier(0.2, 0, 0, 1)';
                setTimeout(() => { transformLayer.style.transition = 'none'; }, 260);
            } else {
                transformLayer.style.transition = 'none';
            }
            const rx = Math.round(panX * 10) / 10;
            const ry = Math.round(panY * 10) / 10;
            const rs = Math.round(scale * 1000) / 1000;
            transformLayer.style.transform = `translate3d(${rx}px, ${ry}px, 0) scale(${rs})`;
            if (zoomBadge) {
                zoomBadge.textContent = Math.round(scale * 100) + '%';
            }
        }

        function zoomIn() {
            setZoomAtCenter(scale * 1.2);
        }

        function zoomOut() {
            setZoomAtCenter(scale / 1.2);
        }

        function resetZoom() {
            scale = 1.0;
            centerTree();
        }

        function setZoomAtCenter(newScale) {
            newScale = Math.min(Math.max(newScale, 0.25), 3.0);
            const rect = viewport.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            panX = centerX - (centerX - panX) * (newScale / scale);
            panY = centerY - (centerY - panY) * (newScale / scale);
            scale = newScale;
            updateTransform(true);
        }

        function centerTree() {
            const rect = viewport.getBoundingClientRect();
            const treeW = transformLayer.offsetWidth || 1000;
            scale = 1.0;
            panX = (rect.width - treeW) / 2;
            panY = 60;
            updateTransform(true);
        }

        // Mouse Wheel Zoom
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = viewport.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const zoomDelta = e.deltaY < 0 ? 1.12 : 0.89;
            const newScale = Math.min(Math.max(scale * zoomDelta, 0.25), 3.0);

            // Zoom right at cursor position
            panX = mouseX - (mouseX - panX) * (newScale / scale);
            panY = mouseY - (mouseY - panY) * (newScale / scale);
            scale = newScale;

            updateTransform(false);
        }, { passive: false });

        // Pan Drag Handlers
        viewport.addEventListener('mousedown', (e) => {
            // Agar karta yoki tugmaga bosilgan bo'lsa sudrashni boshlamaymiz
            if (e.target.closest('button') || e.target.closest('.ft-card') || e.target.closest('.ft-controls-panel')) {
                return;
            }
            isDragging = true;
            hasMoved = false;
            startDragX = e.clientX - panX;
            startDragY = e.clientY - panY;
            viewport.classList.add('is-dragging');
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const newPanX = e.clientX - startDragX;
            const newPanY = e.clientY - startDragY;
            if (Math.abs(newPanX - panX) > 2 || Math.abs(newPanY - panY) > 2) {
                hasMoved = true;
            }
            panX = newPanX;
            panY = newPanY;
            updateTransform(false);
        });

        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                viewport.classList.remove('is-dragging');
            }
        });

        // Touch Pinch & Pan Support
        let initialDistance = 0;
        let initialScale = 1.0;

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialScale = scale;
            } else if (e.touches.length === 1) {
                if (e.target.closest('button') || e.target.closest('.ft-card') || e.target.closest('.ft-controls-panel')) {
                    return;
                }
                isDragging = true;
                startDragX = e.touches[0].clientX - panX;
                startDragY = e.touches[0].clientY - panY;
            }
        });

        viewport.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialDistance > 0) {
                e.preventDefault();
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const newScale = Math.min(Math.max(initialScale * (dist / initialDistance), 0.25), 3.0);
                scale = newScale;
                updateTransform(false);
            } else if (e.touches.length === 1 && isDragging) {
                panX = e.touches[0].clientX - startDragX;
                panY = e.touches[0].clientY - startDragY;
                updateTransform(false);
            }
        }, { passive: false });

        viewport.addEventListener('touchend', () => {
            isDragging = false;
            initialDistance = 0;
        });

        // Focus Tree Engine
        async function initFocusTree() {
            const container = document.getElementById('focusTreeCanvas');
            if (!container) return;
            if (!focusTreeData) {
                try {
                    const res = await fetch('/data/tree.json?v=' + Date.now());
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    focusTreeData = await res.json();
                } catch (err) {
                    console.warn('[FocusTree] Failed to load /data/tree.json:', err);
                    focusTreeData = [
                        {
                            id: 'edo',
                            title: 'EDO',
                            children: [
                                {
                                    id: 'edo-rollar',
                                    title: 'Rollar',
                                    children: [
                                        {
                                            id: 'edo-tizim-rollari',
                                            title: 'Tizim rollari',
                                            children: [
                                                { id: 'tr-nazoratchi-asosiy', title: 'Nazoratchi asosiy' },
                                                { id: 'tr-nazoratchi-murojaatlar', title: 'Nazoratchi murojaatlar' },
                                                { id: 'tr-nazoratchi-ichki-hujjatlar', title: 'Nazoratchi ichki hujjatlar' },
                                                { id: 'tr-devonxona-asosiy', title: 'Devonxona asosiy' },
                                                { id: 'tr-devonxona-murojaatlar', title: 'Devonxona murojaatlar' },
                                                { id: 'tr-devonxona-ichki-hujjatlar', title: 'Devonxona ichki hujjatlar' },
                                                { id: 'tr-sektor-fishka', title: 'Sektor fishka' }
                                            ]
                                        },
                                        {
                                            id: 'edo-mf-ijro-rollari',
                                            title: 'MF.IJRO.UZ rollari',
                                            children: [
                                                { id: 'mf-xdfu-print', title: 'XDFU-PRINT' },
                                                { id: 'mf-admin-organizatsii', title: 'Admin organizatsii' },
                                                { id: 'mf-devonxona', title: 'Devonxona' },
                                                { id: 'mf-nazoratchi', title: 'Nazoratchi' },
                                                { id: 'mf-murojaat-nazoratchisi', title: 'Murojaat nazoratchisi' },
                                                { id: 'mf-kadrlar-bolimi', title: "Kadrlar bo'limi" },
                                                { id: 'mf-oddiy-foydalanuvchi', title: 'Oddiy foydalanuvchi' },
                                                { id: 'mf-rahbar', title: 'Rahbar' },
                                                { id: 'mf-ustxat', title: 'Ustxat' },
                                                { id: 'mf-super-nazoratchi', title: 'Super nazoratchi' }
                                            ]
                                        }
                                    ]
                                },
                                {
                                    id: 'edo-xdfu',
                                    title: 'XDFU'
                                }
                            ]
                        },
                        {
                            id: 'e-huquqshunos',
                            title: 'E-huquqshunos',
                            children: [
                                {
                                    id: 'eh-rollar',
                                    title: 'Rollar',
                                    children: [
                                        { id: 'eh-rol-1', title: 'Rol 1' },
                                        { id: 'eh-rol-2', title: 'Rol 2' }
                                    ]
                                }
                            ]
                        },
                        {
                            id: 'mahalla',
                            title: 'Mahalla'
                        }
                    ];
                }
            }
            renderFocusTreeDom();
            centerTree();
        }

        function renderFocusTreeBranch(nodes, parentId, depth) {
            if (!nodes || !nodes.length) return '';
            const depthClass = depth === 0 ? 'ft-depth-0' : (depth === 1 ? 'ft-depth-1' : 'ft-depth-2');
            const isSingle = nodes.length === 1;

            const cols = nodes.map((node, idx) => {
                const hasChildren = Boolean(node.children && node.children.length);
                let connClass = 'ft-connector';
                if (isSingle) connClass += ' ft-single';
                else if (idx === 0) connClass += ' ft-first';
                else if (idx === nodes.length - 1) connClass += ' ft-last';
                else connClass += ' ft-mid';

                const connectorHtml = depth > 0 ? `<div class="${connClass}"></div>` : '';
                const isLink = !hasChildren && Boolean(node.url);
                const btnTag = hasChildren ? 'button' : (isLink ? 'a' : 'div');
                const btnAttrs = hasChildren 
                    ? `type="button" onclick="handleFocusTreeClick('${parentId}', '${node.id}', event)" aria-expanded="false"` 
                    : (isLink ? `href="${node.url}" target="_blank" rel="noopener noreferrer" style="text-decoration: none;" title="Tizimni yangi oynada ochish"` : '');
                const badgeHtml = hasChildren ? `<span class="ft-badge" id="badge-${node.id}">+</span>` : '';
                const iconExternal = isLink ? `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display:inline-block; vertical-align:middle; margin-left:6px;"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>` : '';

                const subTreeHtml = hasChildren ? `
                    <div class="ft-subtree" id="subtree-${node.id}">
                        <div class="ft-stem"></div>
                        ${renderFocusTreeBranch(node.children, node.id, depth + 1)}
                    </div>
                ` : '';

                const hasHint = Boolean(node.hint || node.message);
                const hintText = node.hint || node.message || '';
                const safeTitle = (node.title || '').replace(/'/g, "\\'");
                const safeHint = hintText.replace(/'/g, "\\'");

                const popoverHtml = hasHint ? `
                    <div class="ft-hint-popover">
                        <div style="font-weight:700; color:#38bdf8; margin-bottom:3px; font-size:10px; text-transform:uppercase; letter-spacing:0.5px;">💡 Hint / Izoh</div>
                        <div>${hintText}</div>
                    </div>
                ` : '';

                const subHintHtml = hasHint ? `
                    <div class="ft-hint-sub">${hintText}</div>
                ` : '';

                return `
                    <div class="ft-col" id="col-${node.id}" data-parent-id="${parentId}" data-node-id="${node.id}">
                        ${connectorHtml}
                        <div class="ft-node-anchor" onmouseenter="setInfoBar('${safeTitle}', '${safeHint}')">
                            <${btnTag} class="ft-card ${depthClass} ${hasChildren ? '' : (isLink ? 'ft-link' : 'ft-leaf')}" id="card-${node.id}" ${btnAttrs}>
                                <span>${node.title}</span>
                                ${iconExternal}
                                ${badgeHtml}
                            </${btnTag}>
                            ${popoverHtml}
                            ${subHintHtml}
                        </div>
                        ${subTreeHtml}
                    </div>
                `;
            }).join('');

            return `<div class="ft-branch"><div class="ft-row">${cols}</div></div>`;
        }

        function renderFocusTreeDom() {
            const container = document.getElementById('focusTreeCanvas');
            if (!container || !focusTreeData) return;
            container.innerHTML = renderFocusTreeBranch(focusTreeData, 'root', 0);
            applyFocusTreeState();
        }

        function findNodeById(list, id) {
            if (!list || !list.length) return null;
            for (const item of list) {
                if (item.id === id) return item;
                if (item.children) {
                    const found = findNodeById(item.children, id);
                    if (found) return found;
                }
            }
            return null;
        }

        function setInfoBar(title, desc) {
            const titleEl = document.getElementById('ftInfoTitle');
            const descEl = document.getElementById('ftInfoDesc');
            if (titleEl) titleEl.textContent = title || 'Tanlangan tizim';
            if (descEl) descEl.textContent = desc || "Qo'shimcha izoh yoki yo'riqnoma mavjud emas.";
        }
        window.setInfoBar = setInfoBar;

        function handleFocusTreeClick(parentId, nodeId, evt) {
            if (evt) {
                evt.stopPropagation();
            }
            const currentOpen = focusTreeState[parentId] || null;
            if (currentOpen === nodeId) {
                focusTreeState[parentId] = null;
                resetDescendants(nodeId);
            } else {
                if (currentOpen) resetDescendants(currentOpen);
                focusTreeState[parentId] = nodeId;
            }
            applyFocusTreeState();

            const node = findNodeById(focusTreeData, nodeId);
            if (node) {
                setInfoBar(node.title, node.hint || node.message || '');
            }
        }

        function resetFocusTree() {
            Object.keys(focusTreeState).forEach(k => delete focusTreeState[k]);
            applyFocusTreeState();
            setInfoBar('Barcha rollar yopildi', 'Daraxt dastlabki holatga qaytarildi.');
        }

        function resetDescendants(rootId) {
            const sub = document.getElementById(`subtree-${rootId}`);
            if (!sub) return;
            const cols = sub.querySelectorAll('.ft-col');
            cols.forEach(col => {
                const p = col.getAttribute('data-parent-id');
                if (p) delete focusTreeState[p];
            });
        }

        function applyFocusTreeState() {
            const cols = document.querySelectorAll('.ft-col');
            cols.forEach(col => {
                const parentId = col.getAttribute('data-parent-id');
                const nodeId = col.getAttribute('data-node-id');
                const openId = focusTreeState[parentId] || null;

                const card = document.getElementById(`card-${nodeId}`);
                const subtree = document.getElementById(`subtree-${nodeId}`);
                const badge = document.getElementById(`badge-${nodeId}`);

                if (openId === null) {
                    col.classList.remove('is-collapsed');
                    if (card) {
                        card.classList.remove('is-open');
                        card.setAttribute('aria-expanded', 'false');
                    }
                    if (subtree) subtree.classList.remove('is-open');
                    if (badge) badge.textContent = '+';
                } else if (openId === nodeId) {
                    col.classList.remove('is-collapsed');
                    if (card) {
                        card.classList.add('is-open');
                        card.setAttribute('aria-expanded', 'true');
                    }
                    if (subtree) subtree.classList.add('is-open');
                    if (badge) badge.textContent = '−';
                } else {
                    col.classList.add('is-collapsed');
                    if (card) {
                        card.classList.remove('is-open');
                        card.setAttribute('aria-expanded', 'false');
                    }
                    if (subtree) subtree.classList.remove('is-open');
                    if (badge) badge.textContent = '+';
                }
            });
        }

        let currentTheme = localStorage.getItem('ft_guide_theme') || 'light';
        function applyGuideTheme() {
            if (currentTheme === 'dark') {
                document.body.classList.add('dark-theme');
            } else {
                document.body.classList.remove('dark-theme');
            }
            const txt = document.getElementById('themeToggleText');
            if (txt) {
                txt.textContent = currentTheme === 'dark' ? '🌙 Qorong\'u rejim' : '☀️ Yorug\' rejim';
            }
        }
        function toggleGuideTheme() {
            currentTheme = (currentTheme === 'dark') ? 'light' : 'dark';
            localStorage.setItem('ft_guide_theme', currentTheme);
            applyGuideTheme();
        }
        window.toggleGuideTheme = toggleGuideTheme;

        let hintsVisible = true;
        function toggleTreeHints() {
            hintsVisible = !hintsVisible;
            document.body.classList.toggle('hide-hints', !hintsVisible);
            const txt = document.getElementById('hintToggleText');
            if (txt) {
                txt.textContent = `💡 Hintlar: ${hintsVisible ? 'ON' : 'OFF'}`;
            }
        }
        window.toggleTreeHints = toggleTreeHints;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            applyGuideTheme();
            initFocusTree();
        });
        window.addEventListener('resize', () => {
            // resize handler
        });
    </script>

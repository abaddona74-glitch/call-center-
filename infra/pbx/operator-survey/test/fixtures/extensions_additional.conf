; Shortened copy of what IssabelPBX (FreePBX 2.11 queues module) generates — test fixture, not the real PBX file.
[globals]
#include globals_custom.conf

[ext-queues]
include => ext-queues-custom
exten => 2020159,1,Macro(user-callerid,)
exten => 2020159,n,Answer
exten => 2020159,n,Set(__NODEST=${EXTEN})
exten => 2020159,n,Set(QOPTIONS=${IF($[${LEN(${VQ_OPTIONS})}>0]?${VQ_OPTIONS}:t)}${VQ_CONTINUE})
exten => 2020159,n,Set(VQ_OPTIONS=)
exten => 2020159,n,QueueLog(2020159,${UNIQUEID},NONE,DID,${FROM_DID})
exten => 2020159,n,Queue(2020159,${QOPTIONS},,${QAANNOUNCE},${QMAXWAIT},${QAGI},${QMACRO},${QGOSUB},${QRULE},${QPOSITION})
exten => 2020159,n,Set(__NODEST=)
exten => 2020159,n,Set(_QUEUE_PRIO=0)
exten => 2020159,n,Set(QDEST=${VQ_DEST})
exten => 2020159,n,Set(VQ_DEST=)
exten => 2020159,n,GotoIf($["${QDEST}" = ""]?ivr-4,s,1:${CUT(QDEST,^,1)},${CUT(QDEST,^,2)},${CUT(QDEST,^,3)})
exten => 2020159*,1,Macro(agent-add,2020159,)

; end of [ext-queues]

# Local development infrastructure. Start: pnpm dev:infra   Stop: pnpm dev:infra:down
# The API and web run on the host (pnpm dev) and connect to these ports.
name: callcenter-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: callcenter
      POSTGRES_USER: callcenter
      POSTGRES_PASSWORD: callcenter
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callcenter -d callcenter"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Stand-in for the Issabel PBX MariaDB (asteriskcdrdb + asterisk.users) with a read-only user.
  pbx-db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: devroot
    ports:
      - "127.0.0.1:33060:3306"
    volumes:
      - ./dev-pbx/mariadb-init:/docker-entrypoint-initdb.d:ro
      - pbx-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  pg-data:
  pbx-data:

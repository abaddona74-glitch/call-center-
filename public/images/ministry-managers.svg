  <text x="50" y="252" class="td-name">Avazxonov Nosirxon</text>
  <text x="50" y="279" class="td-phone">99 313 07 17</text>
  <circle cx="430" cy="242" r="3.5" class="bullet"/>
  <text x="445" y="246" class="td-min">Favqulodda vaziyatlar vazirligi</text>
  <circle cx="430" cy="264" r="3.5" class="bullet"/>
  <text x="445" y="268" class="td-min">Suv xo'jaligi vazirligi</text>

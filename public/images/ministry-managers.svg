<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .header-bg { fill: #1e293b; }
      .row-even { fill: #1e293b; fill-opacity: 0.45; }
      .row-odd { fill: #0f172a; fill-opacity: 0.85; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .th { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; font-size: 14px; font-weight: 700; fill: #94a3b8; }
      .td-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; font-size: 14.5px; font-weight: 700; fill: #ffffff; }
      .td-phone { font-family: "Courier New", Courier, monospace, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .td-min { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; font-size: 13.5px; font-weight: 500; fill: #cbd5e1; }
      .grid-line { stroke: #334155; stroke-width: 1; }
      .border { stroke: #8b5cf6; stroke-width: 2; fill: none; }
      .bullet { fill: #a855f7; }
    </style>
  </defs>

  <rect width="1000" height="780" rx="16" class="bg"/>
  <rect x="2" y="2" width="996" height="776" rx="14" class="border"/>

  <!-- Title Banner -->
  <rect x="20" y="20" width="960" height="60" rx="10" fill="#1e293b"/>
  <text x="500" y="56" class="title">Vazirliklarga «UNICON SOFT» MCHJ mas'ul xodimlari</text>

  <!-- Table Header -->
  <rect x="20" y="95" width="960" height="42" rx="6" class="header-bg"/>
  <text x="50" y="122" class="th">F.I.O va Telefon</text>
  <text x="420" y="122" class="th">Biriktirilgan Vazirliklar</text>
  <line x1="20" y1="137" x2="980" y2="137" class="grid-line"/>

  <!-- 1. Abdumannonov A'zamjon -->
  <rect x="20" y="137" width="960" height="84" class="row-even"/>
  <text x="50" y="168" class="td-name">Abdumannonov A'zamjon</text>
  <text x="50" y="195" class="td-phone">99 488 38 38</text>
  <circle cx="430" cy="158" r="3.5" class="bullet"/>
  <text x="445" y="162" class="td-min">Oliy ta'lim, fan va innovatsiyalar vazirligi</text>
  <circle cx="430" cy="180" r="3.5" class="bullet"/>
  <text x="445" y="184" class="td-min">Raqamli texnologiyalar vazirligi</text>
  <circle cx="430" cy="202" r="3.5" class="bullet"/>

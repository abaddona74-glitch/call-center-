  <text x="50" y="363" class="td-phone">93 512 90 90</text>
  <circle cx="430" cy="326" r="3.5" class="bullet"/>
  <text x="445" y="330" class="td-min">Tog'-kon sanoati va geologiya vazirligi</text>
  <circle cx="430" cy="348" r="3.5" class="bullet"/>
  <text x="445" y="352" class="td-min">Sport vazirligi</text>
  <circle cx="430" cy="370" r="3.5" class="bullet"/>

  <!-- Footer -->
  <text x="500" y="750" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">UNICON SOFT Call Center tizimi ma'lumotnomasi</text>
</svg>

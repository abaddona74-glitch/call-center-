  <circle cx="430" cy="437" r="3.5" class="bullet"/>
  <text x="445" y="441" class="td-min">Kambag'allikni qisqartirish va bandlik vazirligi</text>
  <line x1="20" y1="463" x2="980" y2="463" class="grid-line"/>

  <!-- 5. Rahmatullayev Javohir -->
  <rect x="20" y="463" width="960" height="84" class="row-even"/>
  <text x="50" y="494" class="td-name">Rahmatullayev Javohir</text>
  <text x="50" y="521" class="td-phone">97 710 30 08</text>
  <circle cx="430" cy="484" r="3.5" class="bullet"/>
  <text x="445" y="488" class="td-min">Qurilish va uy-joy kommunal xo'jaligi vazirligi</text>
  <circle cx="430" cy="506" r="3.5" class="bullet"/>
  <text x="445" y="510" class="td-min">Energetika vazirligi</text>
  <circle cx="430" cy="528" r="3.5" class="bullet"/>
  <text x="445" y="532" class="td-min">Investitsiyalar, sanoat va savdo vazirligi</text>
  <line x1="20" y1="547" x2="980" y2="547" class="grid-line"/>

  <!-- 6. Murodjonov Shahzod -->
  <rect x="20" y="547" width="960" height="84" class="row-odd"/>
  <text x="50" y="578" class="td-name">Murodjonov Shahzod</text>
  <text x="50" y="605" class="td-phone">90 324 45 23</text>
  <circle cx="430" cy="568" r="3.5" class="bullet"/>
  <text x="445" y="572" class="td-min">Transport vazirligi</text>
  <circle cx="430" cy="590" r="3.5" class="bullet"/>
  <text x="445" y="594" class="td-min">Maktabgacha va maktab ta'limi vazirligi</text>
  <circle cx="430" cy="612" r="3.5" class="bullet"/>
  <text x="445" y="616" class="td-min">Madaniyat vazirligi</text>
  <line x1="20" y1="631" x2="980" y2="631" class="grid-line"/>

  <!-- 7. Mirzakarimov Mustafo -->
  <rect x="20" y="631" width="960" height="84" class="row-even"/>
  <text x="50" y="662" class="td-name">Mirzakarimov Mustafo</text>
  <text x="50" y="689" class="td-phone">99 644 44 47</text>
  <circle cx="430" cy="652" r="3.5" class="bullet"/>
  <text x="445" y="656" class="td-min">Ichki ishlar vazirligi</text>
  <circle cx="430" cy="674" r="3.5" class="bullet"/>
